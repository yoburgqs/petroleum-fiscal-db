name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Playwright
      run: |
        npm install playwright
        npx playwright install chromium --with-deps

    - name: Run Playwright tests against GitHub Pages
      run: node tests/runtime_comprehensive.js
      env:
        TEST_URL: https://yoburgqs.github.io/petroleum-fiscal-db/
