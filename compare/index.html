function populate() {
  const sorted = [...DATA].sort((a,b)=>a.country.localeCompare(b.country));
  const opts = sorted.map(d=>`<option value="${d.country}">${d.country}</option>`).join('');
  document.getElementById('selA').innerHTML += opts;
  document.getElementById('selB').innerHTML += opts;
  document.getElementById('selA').value = 'Norway';
  document.getElementById('selB').value = 'United Kingdom';
  updateComparison();
}
function fmtTake(t) { return t!=null ? t.toFixed(1)+'%' : '&#8212;'; }
function takeColor(t) {
  if(t==null) return '#888';
  if(t>75) return '#e74c3c';
  if(t>60) return '#e67e22';
  if(t>40) return '#f1c40f';
  return '#27ae60';
}
function updateComparison() {
  const a = DATA.find(d=>d.country===document.getElementById('selA').value);
  const b = DATA.find(d=>d.country===document.getElementById('selB').value);
  if (!a || !b) { document.getElementById('cmp-result').innerHTML=''; return; }
  const prices = ['$50','$75','$100','$125'];
  const ta = [a.t50,a.t75,a.t100,a.t125];
  const tb = [b.t50,b.t75,b.t100,b.t125];
  const rows = prices.map((p,i) => {
    const diff = (ta[i]!=null && tb[i]!=null) ? ta[i]-tb[i] : null;
    const diffStr = diff!=null ? (diff>=0?'+':'')+diff.toFixed(1)+'pp' : '&#8212;';
    const diffColor = diff==null?'#888':diff>0?'#e74c3c':diff<0?'#27ae60':'#888';
    return `<tr><td>${p}/bbl</td><td style="font-weight:600;color:${takeColor(ta[i])}">${fmtTake(ta[i])}</td><td style="font-weight:600;color:${takeColor(tb[i])}">${fmtTake(tb[i])}</td><td style="color:${diffColor};font-weight:600;">${diffStr}</td></tr>`;
  }).join('');
  document.getElementById('cmp-result').innerHTML = `
    <div class="cmp-grid">
      <div class="cmp-col">
        <h3 style="margin:0 0 4px;color:#4da6ff;">${a.country}</h3>
        <div style="font-size:11px;color:#888;">${a.mechanic} &middot; ${a.contracts.toLocaleString()} contracts &middot; ${a.region}</div>
      </div>
      <div class="cmp-col">
        <h3 style="margin:0 0 4px;color:#e74c3c;">${b.country}</h3>
        <div style="font-size:11px;color:#888;">${b.mechanic} &middot; ${b.contracts.toLocaleString()} contracts &middot; ${b.region}</div>
      </div>
    </div>
    <h2>Government Take by Price</h2>
    <table>
      <thead><tr><th>Price</th><th style="color:#4da6ff;">${a.country} Take</th><th style="color:#e74c3c;">${b.country} Take</th><th>Difference (A&#8722;B)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="cmp-grid" style="margin-top:16px;">
      <div class="cmp-col">
        <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.08em;">NPV @$75/bbl</div>
        <div style="font-size:1.6em;font-weight:700;color:#4da6ff;margin:4px 0;">${a.npv75!=null?'$'+a.npv75.toFixed(0)+'M':'&#8212;'}</div>
        <div style="font-size:11px;color:#888;">Breakeven: ${a.be75!=null?'$'+a.be75.toFixed(0)+'/bbl':'&#8212;'}</div>
        <div style="font-size:11px;color:#888;">IRR: ${a.irr75!=null?a.irr75.toFixed(1)+'%':'&#8212;'}</div>
      </div>
      <div class="cmp-col">
        <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.08em;">NPV @$75/bbl</div>
        <div style="font-size:1.6em;font-weight:700;color:#e74c3c;margin:4px 0;">${b.npv75!=null?'$'+b.npv75.toFixed(0)+'M':'&#8212;'}</div>
        <div style="font-size:11px;color:#888;">Breakeven: ${b.be75!=null?'$'+b.be75.toFixed(0)+'/bbl':'&#8212;'}</div>
        <div style="font-size:11px;color:#888;">IRR: ${b.irr75!=null?b.irr75.toFixed(1)+'%':'&#8212;'}</div>
      </div>
    </div>
  `;
}
